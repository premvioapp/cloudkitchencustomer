<style>
  body{padding-bottom:110px}
  .hero{background:linear-gradient(135deg,#2b2420,#5a3a2a);color:#fff;padding:26px 18px 22px}
  .hero h1{font-size:26px}
  .hero .tag{opacity:.75;margin-top:4px}
  .hero .table{display:inline-block;margin-top:12px;background:rgba(255,255,255,.14);padding:5px 12px;border-radius:99px;font-weight:600;font-size:14px}
  .stick{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
  .search{position:relative;max-width:640px;margin:0 auto;padding:12px 16px 0}
  .search input{padding:12px 40px;border-radius:12px;font-size:16px}
  .search .sic{display:flex;color:var(--muted);position:absolute;left:29px;top:calc(50% + 6px);transform:translateY(-50%);opacity:.55;pointer-events:none}
  .search .clr{display:grid;place-items:center;padding:0;position:absolute;right:24px;top:calc(50% + 6px);transform:translateY(-50%);border:0;background:#eee;width:26px;height:26px;border-radius:50%;font-size:14px;line-height:1;color:var(--muted)}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;max-width:640px;margin:0 auto}
  .cats::-webkit-scrollbar{display:none}
  .cats button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font-weight:600;font-size:14px;white-space:nowrap}
  .cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{max-width:640px;margin:0 auto;padding:6px 16px}
  .section h2{font-size:19px;margin:22px 0 10px}
  .item{display:flex;gap:12px;padding:14px;margin-bottom:10px;align-items:center}
  .item img{width:74px;height:74px;border-radius:10px;object-fit:cover;flex:none;background:#f1e9e1}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:650}
  .item .ds{font-size:13px;color:var(--muted);margin-top:2px}
  .item .pr{font-weight:700;margin-top:6px;color:var(--brand)}
  .qty{display:flex;align-items:center;gap:6px;flex:none}
  .qty button{width:34px;height:34px;border-radius:10px;border:0;background:var(--brand-soft);color:var(--brand);font-size:20px;font-weight:700;line-height:1}
  .qty .n{min-width:20px;text-align:center;font-weight:700}
  .add{border:1.5px solid var(--brand);color:var(--brand);background:#fff;border-radius:10px;padding:7px 18px;font-weight:700}
  .cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;z-index:30;display:flex;gap:8px}
  .cartbar .go{flex:1;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-radius:14px;font-size:16px;box-shadow:0 6px 20px rgba(194,83,46,.35)}
  .call{flex:none;border-radius:14px;background:#fff;border:1px solid var(--line);padding:0 14px;font-weight:600;box-shadow:var(--shadow)}
  .sheet-bg{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:40;display:flex;align-items:flex-end}
  .sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h2{font-size:20px;margin-bottom:12px}
  .line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .line .nm{flex:1}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:14px 0}
  #ordersPanel .card{padding:16px;margin-bottom:12px}
  .ordbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:78px;font-size:13px}
  .ordbtn .ob{position:relative;display:inline-flex}
  .ordbtn .ob i{position:absolute;top:-7px;right:-12px;font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
  .ordbtn .ob i.delivered{background:var(--green)} .ordbtn .ob i.cancelled{background:#999} .ordbtn .ob i.new{background:var(--brand)}
  .steps{display:flex;margin:14px 0 6px}
  .step{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative}
  .step .dot{width:28px;height:28px;border-radius:50%;background:#eee;margin:0 auto 6px;display:grid;place-items:center;font-size:14px;position:relative;z-index:1}
  .step:not(:first-child)::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:3px;background:#eee}
  .step.done{color:var(--ink);font-weight:600}
  .step.done .dot{background:var(--green);color:#fff}
  .step.done::before{background:var(--green)}
  .empty{text-align:center;padding:60px 20px}

  /* branded loading screen (shows instantly, before any script runs) */
  .splash{position:fixed;inset:0;z-index:200;background:#000;color:#bdbdbd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;transition:opacity .35s ease;padding:24px;text-align:center}
  .splash img{border-radius:50%;animation:ckpulse 1.6s ease-in-out infinite}
  .splash .bar{width:170px;height:4px;border-radius:4px;background:#262626;overflow:hidden}
  .splash .bar i{display:block;width:40%;height:100%;background:#E3141B;border-radius:4px;animation:ckbar 1.1s ease-in-out infinite}
  .splash p{margin:0;font-size:15px}
  .splash .err{color:#fff;max-width:440px;line-height:1.55;font-size:15px}
  .splash .err b{display:block;font-size:19px;margin-bottom:6px}
  .splash button{margin-top:6px;border:0;border-radius:12px;padding:12px 20px;background:#E3141B;color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
  .splash.out{opacity:0;pointer-events:none}
  @keyframes ckpulse{50%{transform:scale(1.06)}}
  @keyframes ckbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){.splash img,.splash .bar i{animation:none}}
</style>
</head>

/* Hide the loading screen as soon as the page shows something (works on its own, no other file needed) */
(function () {
  var app = document.getElementById('app');
  function hide() { var s = document.getElementById('splash'); if (s && !s.classList.contains('out')) { s.classList.add('out'); setTimeout(function () { s.remove(); }, 400); } }
  new MutationObserver(function () { if (app.children.length) hide(); }).observe(app, { childList: true });
  setTimeout(function () {
    var s = document.getElementById('splash');
    if (!s || s.classList.contains('out') || s.querySelector('.err')) return;
    s.innerHTML = '<div class="err"><b>This is taking longer than usual</b>Check your internet connection and try again.</div><button onclick="location.reload()">Try again</button>';
  }, 15000);
})();
</script>

<script>
const table = (new URLSearchParams(location.search).get('table') || '').trim();
const KEY = 'ck_orders_' + table;
let items = [], settings = {}, cart = {}, myOrders = [];
const watching = {};

function loadMine() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } }
function saveMine() { try { localStorage.setItem(KEY, JSON.stringify(Object.keys(watching))); } catch {} }

async function init() {
  if (!CONFIGURED) return showSetupNeeded($('#app'));
  settings = await loadSettings();
  document.title = settings.cafeName + ' · Menu';
  const validTable = table && !/[.#$\[\]\/]/.test(table) && (await db.ref('tables/' + table + '/sort').once('value')).exists();
  if (!validTable) {
    $('#app').innerHTML = `<div class="empty"><div style="color:var(--brand)">${ic('qr', 48)}</div><h2>Please scan the QR code on your table</h2><p class="muted">We couldn't find your table number.</p></div>`;
    return;
  }
  render();
  // live menu (new items, price changes, sold out)
  db.ref('menu').on('value', snap => {
    items = listOf(snap.val()).filter(i => i.available).map(i => ({ ...i, price: Number(i.price) || 0 }))
      .sort((a, b) => String(a.category).localeCompare(b.category) || String(a.name).localeCompare(b.name));
    for (const id in cart) if (!items.find(i => i.id === id)) delete cart[id];
    renderMenu(); renderBar();
  }, e => toast(friendly(e), 'alert'));
  // follow this phone's orders from today (live)
  loadMine().forEach(watchOrder);
}

function watchOrder(id) {
  if (watching[id]) return;
  watching[id] = true;
  db.ref('orders/' + id).on('value', snap => {
    const v = snap.val();
    if (!v || Date.now() - (v.createdAt || 0) > 12 * 3600e3) {
      db.ref('orders/' + id).off(); delete watching[id]; saveMine();
      myOrders = myOrders.filter(o => o.id !== id); renderTrack(); return;
    }
    const o = normOrder({ id, ...v });
    const old = myOrders.find(x => x.id === id);
    if (old && old.status !== o.status) {
      if (o.status === 'processing') toast('Your order ' + o.code + ' is being prepared');
      if (o.status === 'delivered') toast('Order ' + o.code + ' delivered. Enjoy!');
      if (o.status === 'cancelled') toast('Order ' + o.code + ' was cancelled. Please ask staff.', 'alert');
    }
    myOrders = [o, ...myOrders.filter(x => x.id !== id)].sort((a, b) => b.createdAt - a.createdAt);
    renderTrack();
  }, () => { delete watching[id]; saveMine(); });
  saveMine();
}

const cats = () => [...new Set(items.map(i => i.category))];
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const sum = () => Object.entries(cart).reduce((s, [id, n]) => s + (items.find(i => i.id === id)?.price || 0) * n, 0);

      <div class="table">${ic('table', 15)} ${esc(place(table))}</div>
    </header>
    <div class="stick">
      <div class="search"><span class="sic">${ic('search', 17)}</span>
        <input type="search" id="q" placeholder="Search food… e.g. momo, coffee" autocomplete="off" enterkeyhint="search">
        <button class="clr hidden" id="clr" aria-label="Clear search">${ic('x', 14)}</button></div>

  qi.onkeydown = e => { if (e.key === 'Enter') qi.blur(); };
  clr.onclick = () => { qi.value = ''; clr.classList.add('hidden'); renderMenu(); qi.focus(); };

const qtyHtml = id => cart[id]
  ? `<div class="qty"><button data-d="-">−</button><span class="n">${cart[id]}</span><button data-d="+">+</button></div>`
  : `<button class="add" data-d="+">Add</button>`;
const itemHtml = it => `
  <div class="card item">
    ${dishImg(it, '', 200)}
    <div class="info">
      <div class="nm">${esc(it.name)}</div>
      ${it.description ? `<div class="ds">${esc(it.description)}</div>` : ''}
      <div class="pr">${money(it.price)}</div>
    </div>
    <div data-id="${esc(it.id)}">${qtyHtml(it.id)}</div>
  </div>`;

function renderMenu() {
  if (!$('#menu')) return;
  const query = ($('#q')?.value || '').trim();
  $('#cats').classList.toggle('hidden', !!query);
  if (query) {
    const shown = items.filter(it => matches(query, it.name, it.description, it.category));
    $('#menu').innerHTML = shown.length
      ? `<section class="section"><h2>${shown.length} result${shown.length > 1 ? 's' : ''} for “${esc(query)}”</h2>${shown.map(itemHtml).join('')}</section>`
      : `<div class="empty"><div class="muted">${ic('search', 40)}</div><h2>No food found</h2><p class="muted">Try another word, or clear the search to see the full menu.</p></div>`;
  } else {
    const cs = cats();
    $('#cats').innerHTML = cs.map((c, i) => `<button data-c="${i}" class="${i ? '' : 'on'}">${esc(c)}</button>`).join('');
    $('#cats').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      document.getElementById('cat' + b.dataset.c).scrollIntoView({ behavior: 'smooth', block: 'start' });
      [...$('#cats').children].forEach(x => x.classList.toggle('on', x === b));
    };
    $('#menu').innerHTML = cs.length ? cs.map((c, i) => `
      <section class="section" id="cat${i}" style="scroll-margin-top:130px">
        <h2>${esc(c)}</h2>${items.filter(it => it.category === c).map(itemHtml).join('')}
      </section>`).join('') : `<div class="empty muted">The menu is empty right now.</div>`;
  }
  fillPhotos($('#menu'));
  $('#menu').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const box = b.closest('[data-id]'), id = box.dataset.id;
    cart[id] = Math.max(0, Math.min(50, (cart[id] || 0) + (b.dataset.d === '-' ? -1 : 1)));
    if (!cart[id]) delete cart[id];
    box.innerHTML = qtyHtml(id); renderBar();
  };
}

function renderBar() {
  if (!$('#bar')) return;
  const n = count();
  const open = myOrders.filter(o => o.status === 'new' || o.status === 'processing');
  const latest = open[0] || myOrders[0];
  $('#bar').innerHTML = `
    <button class="call" id="call">${ic('hand', 18)}<br>Call waiter</button>
    ${myOrders.length ? `<button class="call ordbtn" id="ords" aria-label="My orders">
      <span class="ob">${ic('note', 18)}<i class="${latest ? esc(latest.status) : ''}">${myOrders.length}</i></span>${n ? 'Orders' : `${latest ? esc(statusWord(latest.status)) : 'My orders'}`}</button>` : ''}
    ${n ? `<button class="btn go" id="go"><span>${n} item${n > 1 ? 's' : ''} · ${money(sum())}</span><span>View cart ${ic('arrow', 16)}</span></button>` : ''}`;
  if ($('#ords')) $('#ords').onclick = openOrders;
  $('#call').onclick = async () => {
    try { await db.ref('calls/' + table).set({ at: TS() }); } catch { /* already called in the last 30 s */ }
    toast('A waiter is on the way');
  };
  if (n) $('#go').onclick = openCart;
}

async function placeOrder(note) {
  const lines = Object.entries(cart).map(([id, qty]) => {
    const it = items.find(i => i.id === id);
    return it && { id, name: it.name, price: it.price, qty };
  }).filter(Boolean);
  if (!lines.length) throw new Error('Your cart is empty.');
  const id = db.ref('orders').push().key;
  try {
    await db.ref().update({
      ['orders/' + id]: {
        table, items: lines, note: String(note || '').slice(0, 300), status: 'new', source: 'qr',
        createdAt: TS(), updatedAt: TS(), createdBy: '', createdByName: '', handledBy: '',
      },
      ['tables/' + table + '/lastOrderAt']: TS(),
    });
  } catch (e) {
    if (/PERMISSION_DENIED/i.test((e.code || '') + e.message)) throw new Error('Could not send. Prices may have just changed or an item sold out, or an order was sent a moment ago. Please wait 10 seconds and try again.');
    throw new Error(friendly(e));
  }
  return id;
}

function openCart() {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  const draw = () => {
    const lines = Object.entries(cart).map(([id, n]) => ({ it: items.find(i => i.id === id), n })).filter(l => l.it);
    if (!lines.length) { bg.remove(); renderMenu(); renderBar(); return; }
    const note = $('#note', bg)?.value || '';
    bg.innerHTML = `<div class="sheet">
      <h2>Your order · ${esc(place(table))}</h2>
      ${lines.map(({ it, n }) => `
        <div class="line" data-id="${esc(it.id)}">
          <div class="nm"><b>${esc(it.name)}</b><div class="small muted">${money(it.price)} each</div></div>
          <div class="qty"><button data-d="-">−</button><span class="n">${n}</span><button data-d="+">+</button></div>
          <div style="min-width:76px;text-align:right;font-weight:600">${money(it.price * n)}</div>
        </div>`).join('')}
      <div class="total"><span>Total</span><span>${money(sum())}</span></div>
      <div class="field"><label>Note for the kitchen (optional)</label>
        <textarea id="note" rows="2" maxlength="300" placeholder="e.g. less spicy, no onion">${esc(note)}</textarea></div>
      <div class="error" id="err"></div>
      <button class="btn block" id="place" style="padding:15px;font-size:16px">Place order</button>
    </div>`;
    $('.sheet', bg).onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.id === 'place') {
        b.disabled = true; b.textContent = 'Sending…';
        try {
          const id = await placeOrder($('#note', bg).value);
          watchOrder(id);
          cart = {}; bg.remove(); renderMenu(); renderBar();
          toast('Order sent! The waiter has been notified.');
          setTimeout(openOrders, 300);
        } catch (err) { $('#err', bg).textContent = err.message; b.disabled = false; b.textContent = 'Place order'; }
        return;
      }
      const id = b.closest('[data-id]')?.dataset.id; if (!id) return;
      cart[id] = (cart[id] || 0) + (b.dataset.d === '-' ? -1 : 1);
      if (cart[id] <= 0) delete cart[id];
      draw(); renderBar();
    };
  };
  document.body.appendChild(bg); draw();
}

const statusWord = s => ({ new: 'Received', processing: 'Preparing', delivered: 'Delivered', cancelled: 'Cancelled' }[s] || s);
// keep the bottom button and (if open) the orders panel up to date
function renderTrack() {
  renderBar();
  const el = $('#ordersPanel'); if (!el) return;
  el.innerHTML = ordersHtml();
}
function openOrders() {
  if ($('#ordersSheet')) return;
  const bg = document.createElement('div');
  bg.className = 'sheet-bg'; bg.id = 'ordersSheet';
  bg.onclick = e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); };
  bg.innerHTML = `<div class="sheet"><div style="display:flex;align-items:center;margin-bottom:12px"><h2 style="margin:0;flex:1">Your orders · ${esc(place(table))}</h2><button class="btn ghost sm" data-close>Close</button></div><div id="ordersPanel">${ordersHtml()}</div></div>`;
  document.body.appendChild(bg);
}
function ordersHtml() {
  const step = (label, icon, on) => `<div class="step ${on ? 'done' : ''}"><div class="dot">${on ? ic('check', 15) : icon}</div>${label}</div>`;
  return myOrders.length ? myOrders.map(o => {
    const s = o.status, lvl = { new: 1, processing: 2, delivered: 3 }[s] || 0;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>Order ${esc(o.code)}</b><span class="pill ${esc(s)}">${s === 'new' ? 'received' : esc(s)}</span></div>
      <div class="small muted" style="margin-top:4px">${o.items.map(l => `${l.qty}× ${esc(l.name)}`).join(', ')} · <b>${money(o.total)}</b></div>
      ${s === 'cancelled' ? '' : `<div class="steps">${step('Received', '1', lvl >= 1)}${step('Preparing', '2', lvl >= 2)}${step('Delivered', '3', lvl >= 3)}</div>`}
    </div>`;
  }).join('') + `<p class="small muted" style="text-align:center;margin:6px 0 0">Updates live. You can keep browsing the menu.</p>` : `<p class="muted">No orders yet.</p>`;
}
init().catch(e => { $('#app').innerHTML = `<div class="empty"><h2>Couldn't load the menu</h2><p class="muted">${esc(friendly(e))}</p></div>`; });
</script>
